plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace "com.m3rd.app"
    compileSdk 34

    defaultConfig {
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    flavorDimensions = ["edition"]

    productFlavors {
        lite {
            dimension "edition"
            applicationId "com.mangog.lite"
            versionNameSuffix "-lite"
            manifestPlaceholders = [
                appName: "Mango Gallery Lite"
            ]
            buildConfigField "boolean", "IS_PRO_BUILD", "false"
            buildConfigField "String", "STORE_PURCHASE_URL", "\"https://apk3rade.mangoad.online/app/com.mangog.app\""
        }
        pro {
            dimension "edition"
            applicationId "com.mangog.app"
            versionNameSuffix "-pro"
            manifestPlaceholders = [
                appName: "Mango Gallery Pro"
            ]
            buildConfigField "boolean", "IS_PRO_BUILD", "true"
            buildConfigField "String", "STORE_PURCHASE_URL", "\"https://apk3rade.mangoad.online/app/com.mangog.app\""
        }
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main {
            java.srcDirs = ['src/main/java']
            res.srcDirs = ['src/main/res']
            assets.srcDirs = ['src/main/assets']
        }
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar', '*.aar'])
}
