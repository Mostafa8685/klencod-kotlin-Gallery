plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace "com.m3rd.app"
    compileSdk 34

    defaultConfig {
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    flavorDimensions = ["edition"]

    productFlavors {
     
        pro {
            dimension "edition"
            applicationId "com.mangog.app"
            versionNameSuffix "-pro"
            manifestPlaceholders = [
                appName: "Gallery Pro"
            ]
            buildConfigField "boolean", "IS_PRO_BUILD", "true"
            buildConfigField "String", "STORE_PURCHASE_URL", "\"https://apk3rade.mangoad.online/app/com.mangog.app\""
        }
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    // نسخ وتصدير ملفات الـ APK تلقائياً إلى app/build/outputs/apk/debug/ للتوافق مع سير عمل Klencod و GitHub Actions
    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            def outputFile = output.outputFile
            if (outputFile != null && outputFile.name.endsWith('.apk')) {
                def targetDir = new File(project.buildDir, "outputs/apk/debug")
                tasks.named("assemble${variant.name.capitalize()}").configure {
                    doLast {
                        copy {
                            from outputFile
                            into targetDir
                        }
                    }
                }
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main {
            java.srcDirs = ['src/main/java']
            res.srcDirs = ['src/main/res']
            assets.srcDirs = ['src/main/assets']
        }
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar', '*.aar'])
}